<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1880" viewBox="0 0 2600 1880">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#65758b"/></marker>
    <style>
      .bg{fill:#f7f8fb}.lane{fill:#fff;stroke:#c8d0db;stroke-width:2}.laneTitle{font:700 18px sans-serif;fill:#25304a}.title{font:700 32px sans-serif;fill:#1f2937}.subtitle{font:15px sans-serif;fill:#667085}.node{fill:#fff;stroke:#718096;stroke-width:2}.entry{fill:#edf1f5;stroke:#718096;stroke-width:2}.action{fill:#f5f2fb;stroke:#7950bf;stroke-width:2}.system{fill:#edf7f1;stroke:#3f8068;stroke-width:2}.warn{fill:#fff8e7;stroke:#b7791f;stroke-width:2}.danger{fill:#fff0f1;stroke:#bb5059;stroke-width:2}.text{font:600 14px sans-serif;fill:#25304a}.small{font:12px sans-serif;fill:#4b5563}.arrow{fill:none;stroke:#65758b;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#65758b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.tag{font:11px sans-serif;fill:#667085}
    </style>
  </defs>
  <rect width="2600" height="1880" class="bg"/>
  <text x="70" y="70" class="title">Nexora · Complete product workflow</text>
  <text x="70" y="98" class="subtitle">User-facing paths, background processing, access boundaries and operational feedback</text>
  <rect x="2010" y="45" width="32" height="20" class="entry"/><text x="2050" y="60" class="tag">User page or entry</text>
  <rect x="2180" y="45" width="32" height="20" class="action"/><text x="2220" y="60" class="tag">User action / decision</text>
  <rect x="2380" y="45" width="32" height="20" class="system"/><text x="2420" y="60" class="tag">System / worker</text>

  <!-- Access and workspace -->
  <rect x="50" y="130" width="2500" height="245" rx="16" class="lane"/>
  <text x="78" y="165" class="laneTitle">01 · Access, session and workspace</text>
  <rect x="95" y="205" width="160" height="58" rx="9" class="entry"/><text x="143" y="239" class="text">Login</text>
  <rect x="325" y="205" width="205" height="58" rx="9" class="action"/><text x="350" y="232" class="text">Validate credentials</text><text x="373" y="250" class="small">and rate limit</text>
  <polygon points="600,205 665,234 600,263 535,234" class="node"/><text x="566" y="238" class="small">Valid?</text>
  <rect x="735" y="205" width="180" height="58" rx="9" class="system"/><text x="759" y="232" class="text">Create session</text><text x="753" y="250" class="small">HTTP-only cookie</text>
  <rect x="985" y="205" width="185" height="58" rx="9" class="entry"/><text x="1031" y="239" class="text">Workspace</text>
  <rect x="1240" y="205" width="235" height="58" rx="9" class="action"/><text x="1268" y="232" class="text">Choose work area</text><text x="1263" y="250" class="small">chat · knowledge · admin</text>
  <rect x="1545" y="205" width="225" height="58" rx="9" class="action"/><text x="1575" y="232" class="text">Preferences</text><text x="1564" y="250" class="small">language · theme · password</text>
  <rect x="1840" y="205" width="160" height="58" rx="9" class="action"/><text x="1882" y="239" class="text">Sign out</text>
  <rect x="535" y="296" width="205" height="46" rx="8" class="danger"/><text x="564" y="325" class="text">Inline login error</text>
  <path d="M255 234 H325 M530 234 H535 M665 234 H735 M915 234 H985 M1170 234 H1240 M1475 234 H1545 M1770 234 H1840" class="arrow"/>
  <path d="M600 263 V319 H535" class="arrow"/><text x="610" y="292" class="tag">no</text><text x="680" y="222" class="tag">yes</text>

  <!-- Knowledge -->
  <rect x="50" y="405" width="2500" height="330" rx="16" class="lane"/>
  <text x="78" y="440" class="laneTitle">02 · Knowledge, upload, OCR and indexing</text>
  <rect x="95" y="485" width="180" height="58" rx="9" class="entry"/><text x="121" y="512" class="text">Knowledge base</text><text x="123" y="530" class="small">authorized sets only</text>
  <rect x="340" y="485" width="170" height="58" rx="9" class="action"/><text x="365" y="512" class="text">Select or create</text><text x="375" y="530" class="small">knowledge set</text>
  <rect x="575" y="485" width="170" height="58" rx="9" class="action"/><text x="605" y="512" class="text">Upload file</text><text x="595" y="530" class="small">or connect source</text>
  <polygon points="815,485 880,514 815,543 750,514" class="node"/><text x="785" y="518" class="small">Allowed?</text>
  <rect x="950" y="485" width="180" height="58" rx="9" class="system"/><text x="982" y="512" class="text">Security scan</text><text x="975" y="530" class="small">type · size · malware</text>
  <polygon points="1200,485 1265,514 1200,543 1135,514" class="node"/><text x="1170" y="518" class="small">Safe?</text>
  <rect x="1335" y="485" width="150" height="58" rx="9" class="system"/><text x="1373" y="519" class="text">Queue job</text>
  <rect x="1555" y="485" width="165" height="58" rx="9" class="system"/><text x="1584" y="512" class="text">Extract text</text><text x="1593" y="530" class="small">Document worker</text>
  <polygon points="1790,485 1855,514 1790,543 1725,514" class="node"/><text x="1763" y="518" class="small">Text?</text>
  <rect x="1925" y="485" width="145" height="58" rx="9" class="system"/><text x="1970" y="519" class="text">OCR</text>
  <rect x="2140" y="485" width="165" height="58" rx="9" class="system"/><text x="2162" y="512" class="text">Chunk &amp; index</text><text x="2177" y="530" class="small">Qdrant</text>
  <rect x="950" y="615" width="180" height="48" rx="8" class="danger"/><text x="978" y="645" class="text">Reject with reason</text>
  <rect x="1135" y="615" width="170" height="48" rx="8" class="warn"/><text x="1167" y="645" class="text">Quarantine file</text>
  <rect x="1815" y="615" width="205" height="48" rx="8" class="warn"/><text x="1852" y="645" class="text">OCR failure + retry</text>
  <rect x="2110" y="615" width="195" height="48" rx="8" class="system"/><text x="2133" y="645" class="text">Indexed + notify</text>
  <path d="M275 514 H340 M510 514 H575 M745 514 H750 M880 514 H950 M1130 514 H1135 M1265 514 H1335 M1485 514 H1555 M1720 514 H1725 M1855 514 H1925 M2070 514 H2140" class="arrow"/>
  <path d="M815 543 V639 H1130" class="arrow"/><path d="M1200 543 V639 H1305" class="arrow"/><path d="M1790 543 V639 H1815" class="arrow"/><path d="M2222 543 V639 H2110" class="arrow"/>
  <text x="842" y="500" class="tag">yes</text><text x="903" y="568" class="tag">no</text><text x="1228" y="500" class="tag">yes</text><text x="1280" y="568" class="tag">no</text><text x="1815" y="500" class="tag">yes</text><text x="1880" y="568" class="tag">no</text>

  <!-- RAG -->
  <rect x="50" y="765" width="2500" height="285" rx="16" class="lane"/>
  <text x="78" y="800" class="laneTitle">03 · Conversation, retrieval and source-grounded answer</text>
  <rect x="95" y="850" width="185" height="58" rx="9" class="entry"/><text x="124" y="877" class="text">Conversation</text><text x="126" y="895" class="small">new or existing</text>
  <rect x="345" y="850" width="220" height="58" rx="9" class="action"/><text x="376" y="877" class="text">Select scope</text><text x="359" y="895" class="small">set · assistant · filters</text>
  <rect x="630" y="850" width="190" height="58" rx="9" class="action"/><text x="672" y="884" class="text">Ask question</text>
  <rect x="885" y="850" width="175" height="58" rx="9" class="entry"/><text x="926" y="884" class="text">Thinking</text>
  <rect x="885" y="960" width="175" height="46" rx="8" class="action"/><text x="921" y="989" class="text">Cancel request</text>
  <rect x="1125" y="850" width="215" height="58" rx="9" class="system"/><text x="1150" y="877" class="text">Access-checked retrieval</text><text x="1191" y="895" class="small">authorized chunks</text>
  <polygon points="1410,850 1475,879 1410,908 1345,879" class="node"/><text x="1365" y="883" class="small">Sources?</text>
  <rect x="1540" y="850" width="190" height="58" rx="9" class="system"/><text x="1576" y="877" class="text">Generate answer</text><text x="1580" y="895" class="small">model provider</text>
  <rect x="1795" y="850" width="215" height="58" rx="9" class="entry"/><text x="1822" y="877" class="text">Answer with citations</text><text x="1850" y="895" class="small">or insufficient support</text>
  <rect x="2075" y="850" width="150" height="58" rx="9" class="action"/><text x="2101" y="877" class="text">Open source</text><text x="2101" y="895" class="small">drawer / sheet</text>
  <rect x="2290" y="850" width="165" height="58" rx="9" class="action"/><text x="2327" y="877" class="text">Feedback</text><text x="2314" y="895" class="small">copy · share</text>
  <path d="M280 879 H345 M565 879 H630 M820 879 H885 M1060 879 H1125 M1340 879 H1345 M1475 879 H1540 M1730 879 H1795 M2010 879 H2075 M2225 879 H2290" class="arrow"/>
  <path d="M972 908 V960" class="arrow"/><text x="1000" y="944" class="tag">user stops</text>

  <!-- Admin -->
  <rect x="50" y="1080" width="2500" height="245" rx="16" class="lane"/>
  <text x="78" y="1115" class="laneTitle">04 · Administration, assistants and access control</text>
  <rect x="95" y="1155" width="170" height="58" rx="9" class="entry"/><text x="126" y="1189" class="text">Admin area</text>
  <rect x="330" y="1155" width="200" height="58" rx="9" class="action"/><text x="370" y="1182" class="text">Team members</text><text x="365" y="1200" class="small">admins first, users next</text>
  <rect x="595" y="1155" width="205" height="58" rx="9" class="action"/><text x="632" y="1182" class="text">Invite / edit user</text><text x="626" y="1200" class="small">role · title · password</text>
  <rect x="865" y="1155" width="205" height="58" rx="9" class="action"/><text x="903" y="1182" class="text">Grant set access</text><text x="895" y="1200" class="small">view · edit · manage</text>
  <rect x="1135" y="1155" width="185" height="58" rx="9" class="action"/><text x="1174" y="1189" class="text">Assistants</text>
  <rect x="1385" y="1155" width="230" height="58" rx="9" class="action"/><text x="1415" y="1182" class="text">Configure assistant</text><text x="1416" y="1200" class="small">instructions · model · sources</text>
  <rect x="1680" y="1155" width="190" height="58" rx="9" class="system"/><text x="1710" y="1182" class="text">Enforce policy</text><text x="1718" y="1200" class="small">API + retrieval</text>
  <rect x="1935" y="1155" width="245" height="58" rx="9" class="entry"/><text x="1965" y="1182" class="text">Role-aware navigation</text><text x="1986" y="1200" class="small">only allowed actions</text>
  <rect x="2245" y="1155" width="180" height="58" rx="9" class="danger"/><text x="2274" y="1182" class="text">Delete member</text><text x="2288" y="1200" class="small">confirmation</text>
  <path d="M265 1184 H330 M530 1184 H595 M800 1184 H865 M1070 1184 H1135 M1320 1184 H1385 M1615 1184 H1680 M1870 1184 H1935 M2180 1184 H2245" class="arrow"/>

  <!-- operations -->
  <rect x="50" y="1355" width="2500" height="405" rx="16" class="lane"/>
  <text x="78" y="1390" class="laneTitle">05 · Connectors, observability, notifications and reporting</text>
  <rect x="95" y="1440" width="180" height="58" rx="9" class="entry"/><text x="127" y="1467" class="text">Connect source</text><text x="126" y="1485" class="small">web · GitHub · webhook</text>
  <rect x="340" y="1440" width="190" height="58" rx="9" class="action"/><text x="371" y="1467" class="text">Validate connection</text><text x="373" y="1485" class="small">store secret safely</text>
  <rect x="595" y="1440" width="175" height="58" rx="9" class="system"/><text x="637" y="1474" class="text">Schedule sync</text>
  <rect x="835" y="1440" width="175" height="58" rx="9" class="system"/><text x="873" y="1467" class="text">Lease + sync</text><text x="870" y="1485" class="small">connector worker</text>
  <rect x="1075" y="1440" width="190" height="58" rx="9" class="system"/><text x="1102" y="1467" class="text">Create document jobs</text><text x="1121" y="1485" class="small">same ingestion path</text>
  <rect x="1330" y="1440" width="195" height="58" rx="9" class="system"/><text x="1361" y="1467" class="text">Metrics and logs</text><text x="1351" y="1485" class="small">errors · queue · latency</text>
  <rect x="1590" y="1440" width="195" height="58" rx="9" class="system"/><text x="1618" y="1467" class="text">Health / readiness</text><text x="1626" y="1485" class="small">API · DB · workers</text>
  <rect x="1850" y="1440" width="180" height="58" rx="9" class="entry"/><text x="1883" y="1474" class="text">Notifications</text>
  <rect x="2095" y="1440" width="190" height="58" rx="9" class="entry"/><text x="2130" y="1467" class="text">Analytics</text><text x="2122" y="1485" class="small">period · health · usage</text>
  <rect x="95" y="1590" width="190" height="58" rx="9" class="action"/><text x="129" y="1617" class="text">Read / resolve alert</text><text x="133" y="1635" class="small">actionable status</text>
  <rect x="350" y="1590" width="190" height="58" rx="9" class="action"/><text x="383" y="1624" class="text">Export report</text>
  <rect x="605" y="1590" width="230" height="58" rx="9" class="system"/><text x="638" y="1617" class="text">Backup and retention</text><text x="655" y="1635" class="small">restore-tested data</text>
  <rect x="900" y="1590" width="205" height="58" rx="9" class="danger"/><text x="930" y="1617" class="text">Operational incident</text><text x="943" y="1635" class="small">runbook response</text>
  <path d="M275 1469 H340 M530 1469 H595 M770 1469 H835 M1010 1469 H1075 M1265 1469 H1330 M1525 1469 H1590 M1785 1469 H1850 M2030 1469 H2095" class="arrow"/>
  <path d="M1940 1498 V1590 H285" class="arrow"/><path d="M2190 1498 V1590 H540" class="arrow"/><path d="M1427 1498 V1619 H900" class="arrow"/>
  <path d="M1075 1498 V1720 H2140 V543 H1335" class="dash"/><text x="1450" y="1708" class="tag">Connector-created documents re-enter the secured processing flow</text>

  <!-- footer -->
  <line x1="70" y1="1810" x2="2530" y2="1810" stroke="#c8d0db"/>
  <text x="70" y="1842" class="subtitle">Responsive notes: mobile replaces sidebar with a focus-trapped drawer; source and filter panels become bottom sheets; tables become controlled horizontal scroll or summary cards.</text>
</svg>
